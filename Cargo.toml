gix-pack = { path = "C:/Programming/Rust/gitoxide/gix-pack" }
gix-packetline = { path = "C:/Programming/Rust/gitoxide/gix-packetline" }
gix-path = { path = "C:/Programming/Rust/gitoxide/gix-path" }
gix-pathspec = { path = "C:/Programming/Rust/gitoxide/gix-pathspec" }
gix-prompt = { path = "C:/Programming/Rust/gitoxide/gix-prompt" }
gix-protocol = { path = "C:/Programming/Rust/gitoxide/gix-protocol" }
gix-quote = { path = "C:/Programming/Rust/gitoxide/gix-quote" }
gix-ref = { path = "C:/Programming/Rust/gitoxide/gix-ref" }
gix-refspec = { path = "C:/Programming/Rust/gitoxide/gix-refspec" }
gix-revision = { path = "C:/Programming/Rust/gitoxide/gix-revision" }
