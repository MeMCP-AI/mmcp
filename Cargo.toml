gix-sec = { path = "C:/Programming/Rust/gitoxide/gix-sec" }
gix-shallow = { path = "C:/Programming/Rust/gitoxide/gix-shallow" }
gix-status = { path = "C:/Programming/Rust/gitoxide/gix-status" }
gix-submodule = { path = "C:/Programming/Rust/gitoxide/gix-submodule" }
gix-tempfile = { path = "C:/Programming/Rust/gitoxide/gix-tempfile" }
gix-trace = { path = "C:/Programming/Rust/gitoxide/gix-trace" }
gix-transport = { path = "C:/Programming/Rust/gitoxide/gix-transport" }
