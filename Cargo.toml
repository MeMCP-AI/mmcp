[workspace]
resolver = "3"
# `webui` is a separate Cargo project (Leptos SSR) with its own
# workspace. The `crates/*/fuzz` directories each hold a
# cargo-fuzz harness whose `libfuzzer-sys` dep only compiles under
# libFuzzer on Linux/macOS; excluding them keeps workspace-wide
# `cargo check` / `cargo test` cross-platform.
exclude = ["webui", "gui/src-tauri", "crates/mmcp-core/fuzz"]
members = [
    "crates/mmcp-core",
    "crates/mmcp-git",
    "crates/mmcp-db",
    "crates/mmcp-auth",
    "crates/mmcp-proto",
    "crates/mmcp-session",
    "crates/mmcp-sync",
    "crates/mmcp-store",
    "crates/mmcp-server",
    "crates/mmcp-client",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
authors = ["Gabriel GRONDIN"]

[workspace.dependencies]
# Workspace member crates
mmcp-core = { path = "crates/mmcp-core", version = "0.1.0" }
mmcp-git = { path = "crates/mmcp-git", version = "0.1.0" }
mmcp-db = { path = "crates/mmcp-db", version = "0.1.0" }
mmcp-auth = { path = "crates/mmcp-auth", version = "0.1.0" }
mmcp-proto = { path = "crates/mmcp-proto", version = "0.1.0" }
mmcp-session = { path = "crates/mmcp-session", version = "0.1.0" }
mmcp-sync = { path = "crates/mmcp-sync", version = "0.1.0" }
mmcp-store = { path = "crates/mmcp-store", version = "0.1.0" }

# Error handling
thiserror = "2"
anyhow = "1"

# Async runtime
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "io-util", "process", "time", "fs"] }
async-trait = "0.1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# CLI
clap = { version = "4", features = ["derive"] }
inquire = { version = "0.9", default-features = false, features = ["crossterm"] }

# Slugification (Unicode-aware: NFD + diacritic stripping). Used
# wherever we derive a file-safe slug from human-facing text — memory
# filenames on import, CLAUDE.md section headings on convert.
slug = "0.1"

# Hex encoding / decoding. Used by the server token-key loader to
# accept a `MMCP_TOKEN_KEY_HEX` env var as 32 raw bytes.
hex = "0.4"

# Serialization
serde = { version = "1", features = ["derive"] }

# Identifiers
uuid = { version = "1", features = ["v7", "serde"] }

# OS CSPRNG for token keys and one-shot nonces (thin wrapper over
# getrandom / BCryptGenRandom — the same primitive every other
# random-byte consumer in the graph already uses).
getrandom = "0.3"

# Date and time
jiff = { version = "0.2", features = ["serde"] }

# Semantic versioning
semver = { version = "1", features = ["serde"] }

# TOML parsing and rendering
toml = "0.9"

# Database (SeaORM with sqlx backend)
sea-orm = { version = "1.1", default-features = false, features = ["sqlx-sqlite", "sqlx-postgres", "runtime-tokio-rustls", "macros", "with-uuid"] }
sea-orm-migration = { version = "1.1", default-features = false, features = ["sqlx-sqlite", "sqlx-postgres", "runtime-tokio-rustls", "with-uuid"] }

# Statically link libsqlite3 into our binaries so the distroless
# runtime image (which ships no shared sqlite) can open `sqlite::`
# URLs. Features are additive, so pulling this in from mmcp-db is
# enough to force bundled linking across every transitive use.
libsqlite3-sys = { version = "0.30", features = ["bundled"] }

# Git backend (gitoxide). Transport features enable clone/fetch/push
# over HTTP via reqwest+rustls, and the `serve-*` features light up the
# server-side upload-pack / receive-pack state machines so mmcp-server
# never has to shell out to the `git` binary. Every git operation in
# the workspace — client and server — stays inside gix.
gix = { version = "0.81", default-features = false, features = [
    "sha1",
    "revision",
    "blob-diff",
    "index",
    "worktree-mutation",
    # `parallel` switches gix-features to Arc-backed threading primitives.
    # `serve-upload-pack` drives `gix_pack::data::output::entry::iter_from_counts`,
    # which internally spawns worker threads over crossbeam and thus
    # requires its input types to be `Send`. Without `parallel`,
    # `gix_odb::Store` is `Rc`-backed and the serve path fails to compile.
    # (Fork DX note: the serve-upload-pack feature should ideally imply
    # parallel on its own; pending fork-side fix.)
    "parallel",
    "blocking-http-transport-reqwest-rust-tls",
    "serve-upload-pack",
    "serve-receive-pack",
] }

# Bytes container
bytes = "1"

# Authentication
argon2 = "0.5"
rusty_paseto = { version = "0.7", default-features = false, features = ["v4_local", "batteries_included"] }
axum-login = "0.18"
tower-sessions = "0.14"
webauthn-rs = { version = "0.5", features = ["danger-allow-state-serialisation"] }

# HTTP framework
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio", "macros", "query"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["trace", "cors"] }

# Async stream <-> AsyncRead bridging (used by git smart-HTTP streaming)
tokio-util = { version = "0.7", features = ["io", "io-util"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }

# MCP SDK (official Rust implementation)
rmcp = { version = "1.5", features = ["server", "macros", "transport-io", "elicitation", "schemars"] }

# HTTP client (for sync engine talking to mmcp-server)
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

# HTTP mocking for tests
wiremock = "0.6"

[workspace.lints.rust]
unsafe_code = "forbid"

# Redirect every gitoxide crate to the local fork at
# C:/Programming/Rust/gitoxide, which carries the pre-upstream
# implementation of client push and server-side Smart HTTP. Covers
# direct and transitive gix-* resolution so nothing slips back to
# crates.io. Remove this block once the push + serve work lands in
# a released gix on crates.io (handoff plan lives in the fork's
# own GITOXIDE_UPSTREAM_HANDOFF.md).
[patch.crates-io]
gix = { path = "C:/Programming/Rust/gitoxide/gix" }
gix-actor = { path = "C:/Programming/Rust/gitoxide/gix-actor" }
gix-archive = { path = "C:/Programming/Rust/gitoxide/gix-archive" }
gix-attributes = { path = "C:/Programming/Rust/gitoxide/gix-attributes" }
