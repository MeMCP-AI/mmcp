[workspace]
resolver = "3"
# The `crates/*/fuzz` directories each hold a cargo-fuzz harness
# whose `libfuzzer-sys` dep only compiles under libFuzzer on
# Linux/macOS; excluding them keeps workspace-wide `cargo check` /
# `cargo test` cross-platform. `gui/src-tauri` is its own Cargo
# project with Tauri-specific deps. `webui/` is now a pure SvelteKit
# + Tailwind frontend, so it no longer intersects the Rust workspace
# at all.
exclude = ["gui/src-tauri", "crates/mmcp-core/fuzz"]
members = [
    "crates/mmcp-core",
    "crates/mmcp-git",
    "crates/mmcp-db",
    "crates/mmcp-auth",
    "crates/mmcp-proto",
    "crates/mmcp-session",
    "crates/mmcp-sync",
    "crates/mmcp-store",
    "crates/mmcp-server",
    "crates/mmcp-client",
]

[workspace.package]
version = "0.1.127"
edition = "2024"
rust-version = "1.94"
authors = ["Gabriel GRONDIN"]

[workspace.dependencies]
# Workspace member crates
mmcp-core = { path = "crates/mmcp-core", version = "0.1.0" }
mmcp-git = { path = "crates/mmcp-git", version = "0.1.0" }
mmcp-db = { path = "crates/mmcp-db", version = "0.1.0" }
mmcp-auth = { path = "crates/mmcp-auth", version = "0.1.0" }
mmcp-proto = { path = "crates/mmcp-proto", version = "0.1.0" }
mmcp-session = { path = "crates/mmcp-session", version = "0.1.0" }
mmcp-sync = { path = "crates/mmcp-sync", version = "0.1.0" }
mmcp-store = { path = "crates/mmcp-store", version = "0.1.0" }

# Error handling
thiserror = "2"
anyhow = "1"

# Async runtime
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "io-util", "process", "time", "fs"] }
async-trait = "0.1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# CLI
clap = { version = "4", features = ["derive"] }
inquire = { version = "0.9", default-features = false, features = ["crossterm"] }

# Slugification (Unicode-aware: NFD + diacritic stripping). Used
# wherever we derive a file-safe slug from human-facing text — memory
# filenames on import, CLAUDE.md section headings on convert.
slug = "0.1"

# Hex encoding / decoding. Used by the server token-key loader to
# accept a `MMCP_TOKEN_KEY_HEX` env var as 32 raw bytes.
hex = "0.4"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Identifiers
uuid = { version = "1", features = ["v7", "serde"] }

# OS CSPRNG for token keys and one-shot nonces (thin wrapper over
# getrandom / BCryptGenRandom — the same primitive every other
# random-byte consumer in the graph already uses).
getrandom = "0.4"

# Date and time
jiff = { version = "0.2", features = ["serde"] }

# Semantic versioning
semver = { version = "1", features = ["serde"] }

# Enum <-> string mirror-list generation (variant array, static str
# conversion). Replaces the hand-rolled `define_mcp_tool_id!` /
# `define_memory_kind!` declarative macros: the "derive" feature
# re-exports strum_macros' derive macros through the `strum` crate
# itself, so both crates are pulled in explicitly at the same pinned
# version instead of leaving strum_macros as an implicit transitive.
strum = { version = "0.28", features = ["derive"] }
strum_macros = "0.28"

# Bounded, thread-safe in-memory cache with size-based eviction (LRU
# family). Used by mmcp-git's native backend to cap the previously
# unbounded process-lifetime repo_cache HashMap. The `sync` variant
# is a plain blocking `Cache`, matching every caller already running
# inside `spawn_blocking`, never `async` moka.
moka = { version = "0.12", default-features = false, features = ["sync"] }

# TOML parsing and rendering
toml = "1.1"

# Database (SeaORM with sqlx backend)
sea-orm = { version = "2.0", default-features = false, features = ["sqlx-sqlite", "sqlx-postgres", "runtime-tokio-rustls", "macros", "with-uuid"] }
sea-orm-migration = { version = "2.0", default-features = false, features = ["sqlx-sqlite", "sqlx-postgres", "runtime-tokio-rustls", "with-uuid"] }

# Raw sqlx (same backend sea-orm already pulls in) for mmcp-store's
# local content cache. The cache is a small, fully-owned, freely
# rebuildable derived index -- a couple of tables this crate creates
# and drops on demand -- so it talks to SQLite directly instead of
# through sea-orm's entity/migration ceremony, while staying on the
# exact same underlying SQLite build (bundled libsqlite3-sys) sea-orm
# already resolves, so no second copy of the C library enters the
# graph.
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "tls-rustls", "sqlite", "macros", "uuid"] }

# Local embedding vectorizer for the content cache's semantic search
# (see `crates/mmcp-store/src/cache/embed.rs` for the full rationale):
# tokenizes memory text into Unicode words (pure Rust, locale-free
# word-boundary rules) ahead of feature-hashing them into a vector.
unicode-segmentation = "1"

# Pure-Rust, non-cryptographic hash used by the same embedding path
# to turn each token into a fixed-size vector bucket (the "hashing
# trick" / feature hashing, the same technique scikit-learn's
# HashingVectorizer and Vowpal Wabbit use).
xxhash-rust = { version = "0.8", features = ["xxh3"] }

# Vector container + dot-product/norm ops for cosine similarity, so
# the embedding/query path never hand-rolls the actual vector math.
ndarray = "0.16"

# Statically link libsqlite3 into our binaries so the distroless
# runtime image (which ships no shared sqlite) can open `sqlite::`
# URLs. Features are additive, so pulling this in from mmcp-db is
# enough to force bundled linking across every transitive use.
libsqlite3-sys = { version = "0.37", features = ["bundled"] }

# Git backend (gitoxide). Transport features enable clone/fetch/push
# over HTTP via reqwest+rustls, and the `serve-*` features light up the
# server-side upload-pack / receive-pack state machines so mmcp-server
# never has to shell out to the `git` binary. Every git operation in
# the workspace — client and server — stays inside gix.
gix = { version = "0.81", default-features = false, features = [
    "sha1",
    "revision",
    "blob-diff",
    "index",
    "worktree-mutation",
    "blocking-http-transport-reqwest-rust-tls",
    "serve-upload-pack",
    "serve-receive-pack",
    "tree-editor",
] }

# Bytes container
bytes = "1"

# Authentication
argon2 = "0.5"
rusty_paseto = { version = "0.10", default-features = false, features = ["v4_local", "batteries_included"] }
axum-login = "0.18"
tower-sessions = "0.14"
webauthn-rs = { version = "0.5", features = ["danger-allow-state-serialisation"] }
# tower-sessions' own `Expiry` variants take this crate's `Duration`
# directly; declared explicitly rather than relying on the transitive
# pull-in so the version is pinned at the workspace level like every
# other dependency.
time = "0.3"

# HTTP framework
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio", "macros", "query"] }
tower-http = { version = "0.6", features = ["trace", "cors"] }

# Async stream <-> AsyncRead bridging (used by git smart-HTTP streaming)
tokio-util = { version = "0.7", features = ["io", "io-util"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }

# MCP SDK (official Rust implementation)
rmcp = { version = "=3.1.1", features = ["server", "macros", "transport-io", "elicitation", "schemars"] }

# HTTP client (for sync engine talking to mmcp-server)
reqwest = { version = "0.13", default-features = false, features = ["json", "form", "rustls"] }

# OAuth2 client (authorize-url building, CSRF state + PKCE, token
# exchange). The "reqwest" feature's async `AsyncHttpClient` impl is
# only for oauth2's OWN transitively pulled reqwest major version
# (re-exported as `oauth2::reqwest` since this workspace's own
# `reqwest` above is pinned to a different major); "rustls-tls"
# matches the TLS backend the workspace's own reqwest dependency
# uses ("rustls" feature above), rather than mixing in native-tls.
oauth2 = { version = "5", default-features = false, features = ["reqwest", "rustls-tls"] }

# AsciiDoc parser + Markdown renderer, used by the `mmcp import`
# path so operators can import `.adoc` / `.asciidoc` source files
# alongside markdown. The Markdown converter is not yet published
# on crates.io; the parser is (0.8.0) but we pull both from the
# same git revision for API compatibility. Pinned to an exact commit
# (rather than tracking `branch = "main"`) because `gui/src-tauri` is
# excluded from this workspace and resolves through its own separate
# Cargo.lock: an unpinned branch reference lets the two lockfiles
# independently drift to different commits, and the acdc branch tip
# has already moved past API `mmcp-store/src/import_adoc.rs` depends
# on (removed `Diagnostics` export, removed `warning_source()` /
# `document()` methods, changed `write_to()` arity). Pinning both
# resolutions to the same commit keeps them in agreement.
acdc-parser = { git = "https://github.com/nlopes/acdc.git", rev = "34ee1ffe35f573673de7e7bdfca8bc153a8b94ea", features = ["setext"] }
acdc-converters-core = { git = "https://github.com/nlopes/acdc.git", rev = "34ee1ffe35f573673de7e7bdfca8bc153a8b94ea" }
acdc-converters-markdown = { git = "https://github.com/nlopes/acdc.git", rev = "34ee1ffe35f573673de7e7bdfca8bc153a8b94ea" }

# HTTP mocking for tests
wiremock = "0.6"

[workspace.lints.rust]
unsafe_code = "forbid"
warnings = "deny"
unused_qualifications = "deny"

[workspace.lints.clippy]
all = "deny"
unwrap_used = "deny"
expect_used = "deny"

# Redirect every gitoxide crate to the GGLinnk/gitoxide fork, which
# carries the pre-upstream implementation of client push and
# server-side Smart HTTP. Pinned to an exact commit (rather than
# tracking the branch tip) because the branch has been rewritten more
# than once and its tip does not currently build.
#
# Investigated 2026-08-04: the old pin (d70d0a1) is no longer an
# ancestor of the branch tip (12d7bbd8) at all, its whole line having
# been rebased away. The current tip's own history restores both
# features on a fresh line: 0858d418f ("feat(gix): add Remote::push,
# serve-pack endpoints, in-process transport") is the first commit
# with serve-upload-pack / serve-receive-pack again, and 12d7bbd8
# (tip) is a docs-only commit recording both as complete in
# crate-status.md. But `cargo check --workspace` against 12d7bbd8
# fails to compile: gix-pack's push.rs (data/output/count/push.rs
# lines 156, 204, 232) still calls TagRefIter::from_bytes,
# CommitRefIter::from_bytes and TreeRefIter::from_bytes with one
# argument, while gix-object at the same revision requires a second
# `gix_hash::Kind` argument since d4439cd5b ("Limit Commit and Tag
# parsing to a given gix_hash::Kind") landed earlier on the same
# branch; no later commit on the branch fixes gix-pack's call sites,
# and 12d7bbd8 is confirmed to be the branch tip (matches `git
# ls-remote`). Re-pin to a newer commit only after confirming both
# features resolve AND the workspace actually compiles against it.
# Covers direct and transitive gix-* resolution so nothing slips back
# to crates.io. Remove this block once the push + serve work lands in
# a released gix on crates.io (handoff plan lives in the fork's own
# GITOXIDE_UPSTREAM_HANDOFF.md).
[patch.crates-io]
gix = { git = "https://github.com/GGLinnk/gitoxide.git", rev = "d70d0a1b7c0eb9872a0eb49a755d4b8a7af25b61" }
gix-actor = { git = "https://github.com/GGLinnk/gitoxide.git", rev = "d70d0a1b7c0eb9872a0eb49a755d4b8a7af25b61" }
