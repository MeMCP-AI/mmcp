gix-chunk = { path = "C:/Programming/Rust/gitoxide/gix-chunk" }
gix-command = { path = "C:/Programming/Rust/gitoxide/gix-command" }
gix-commitgraph = { path = "C:/Programming/Rust/gitoxide/gix-commitgraph" }
gix-config = { path = "C:/Programming/Rust/gitoxide/gix-config" }
gix-config-value = { path = "C:/Programming/Rust/gitoxide/gix-config-value" }
gix-credentials = { path = "C:/Programming/Rust/gitoxide/gix-credentials" }
gix-date = { path = "C:/Programming/Rust/gitoxide/gix-date" }
