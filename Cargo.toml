gix-ignore = { path = "C:/Programming/Rust/gitoxide/gix-ignore" }
gix-index = { path = "C:/Programming/Rust/gitoxide/gix-index" }
gix-lock = { path = "C:/Programming/Rust/gitoxide/gix-lock" }
gix-merge = { path = "C:/Programming/Rust/gitoxide/gix-merge" }
gix-negotiate = { path = "C:/Programming/Rust/gitoxide/gix-negotiate" }
