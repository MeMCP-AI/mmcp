gix-error = { path = "C:/Programming/Rust/gitoxide/gix-error" }
gix-features = { path = "C:/Programming/Rust/gitoxide/gix-features" }
gix-filter = { path = "C:/Programming/Rust/gitoxide/gix-filter" }
gix-fs = { path = "C:/Programming/Rust/gitoxide/gix-fs" }
