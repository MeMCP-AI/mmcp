[workspace]
resolver = "3"
members = [
    "crates/mmcp-core",
    "crates/mmcp-git",
    "crates/mmcp-db",
    "crates/mmcp-auth",
    "crates/mmcp-proto",
    "crates/mmcp-session",
    "crates/mmcp-sync",
    "crates/mmcp-server",
    "crates/mmcp-client",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
authors = ["Gabriel GRONDIN"]

[workspace.dependencies]
# Workspace member crates
mmcp-core = { path = "crates/mmcp-core", version = "0.1.0" }
mmcp-git = { path = "crates/mmcp-git", version = "0.1.0" }
mmcp-db = { path = "crates/mmcp-db", version = "0.1.0" }
mmcp-auth = { path = "crates/mmcp-auth", version = "0.1.0" }
mmcp-proto = { path = "crates/mmcp-proto", version = "0.1.0" }
mmcp-session = { path = "crates/mmcp-session", version = "0.1.0" }
mmcp-sync = { path = "crates/mmcp-sync", version = "0.1.0" }

# Error handling
thiserror = "2"
anyhow = "1"

# Async runtime
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# CLI
clap = { version = "4", features = ["derive"] }

# Serialization
serde = { version = "1", features = ["derive"] }

# Identifiers
uuid = { version = "1", features = ["v7", "serde"] }

# Date and time
jiff = { version = "0.2", features = ["serde"] }

# Semantic versioning
semver = { version = "1", features = ["serde"] }

# TOML parsing and rendering
toml = "0.9"

# Database (SeaORM with sqlx backend)
sea-orm = { version = "1.1", default-features = false, features = ["sqlx-sqlite", "sqlx-postgres", "runtime-tokio-rustls", "macros", "with-uuid"] }
sea-orm-migration = { version = "1.1", default-features = false, features = ["sqlx-sqlite", "sqlx-postgres", "runtime-tokio-rustls", "with-uuid"] }

# Git backend (gitoxide)
gix = { version = "0.72", default-features = false, features = ["revision", "blob-diff", "index", "worktree-mutation"] }

# Bytes container
bytes = "1"

# Authentication
argon2 = "0.5"
rusty_paseto = { version = "0.7", default-features = false, features = ["v4_local", "batteries_included"] }

[workspace.lints.rust]
unsafe_code = "forbid"
