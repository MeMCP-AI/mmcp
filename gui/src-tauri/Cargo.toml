[package]
name = "mmcp-gui-tauri"
version = "0.1.0"
description = "mmcp-gui: Tauri 2 backend wrapping mmcp-store for the SvelteKit desktop client."
authors = ["Gabriel GRONDIN"]
edition = "2024"
rust-version = "1.85"

# Tauri 2 convention: a tiny `main.rs` delegates to a library entry
# point (`lib.rs`) that actually builds the app. Keeping the real
# wiring in the lib crate lets the future `mmcp-gui-tauri` unit
# tests import it without going through the binary.
[lib]
name = "mmcp_gui_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "mmcp-gui-tauri"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Workspace store layer — path deps because src-tauri/ is excluded
# from the Rust workspace (see root Cargo.toml `[workspace.exclude]`).
mmcp-core = { path = "../../crates/mmcp-core" }
mmcp-git = { path = "../../crates/mmcp-git" }
mmcp-store = { path = "../../crates/mmcp-store" }
mmcp-sync = { path = "../../crates/mmcp-sync" }

tauri = { version = "2", features = ["devtools"] }
tauri-plugin-dialog = "2"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v7", "serde"] }
semver = { version = "1", features = ["serde"] }
anyhow = "1"
similar = { version = "2", features = ["inline"] }
notify-debouncer-mini = "0.4"

# Redirect every gitoxide crate to the GGLinnk/gitoxide fork.
# mmcp-git declares `gix` features (`serve-upload-pack`,
# `serve-receive-pack`) that only exist in the fork — crates.io
# `gix` 0.81 doesn't know them. The root workspace Cargo.toml applies
# the same patch for workspace members, but this crate is excluded
# from the workspace (it's the Tauri backend), so the patch has to
# be repeated here. Remove both copies once the fork's push + serve
# work lands on crates.io (handoff plan in the fork's
# GITOXIDE_UPSTREAM_HANDOFF.md).
[patch.crates-io]
gix = { git = "https://github.com/GGLinnk/gitoxide.git", branch = "2026-04-18_gix-push" }
gix-actor = { git = "https://github.com/GGLinnk/gitoxide.git", branch = "2026-04-18_gix-push" }
