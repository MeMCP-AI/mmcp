gix-object = { path = "../../../gitoxide/gix-object" }
gix-odb = { path = "../../../gitoxide/gix-odb" }
gix-pack = { path = "../../../gitoxide/gix-pack" }
gix-packetline = { path = "../../../gitoxide/gix-packetline" }
gix-path = { path = "../../../gitoxide/gix-path" }
gix-pathspec = { path = "../../../gitoxide/gix-pathspec" }
gix-prompt = { path = "../../../gitoxide/gix-prompt" }
