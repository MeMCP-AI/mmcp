[package]
name = "mmcp-gui-tauri"
version = "0.1.0"
description = "mmcp-gui: Tauri 2 backend wrapping mmcp-store for the SvelteKit desktop client."
authors = ["Gabriel GRONDIN"]
edition = "2024"
rust-version = "1.85"

# Tauri 2 convention: a tiny `main.rs` delegates to a library entry
# point (`lib.rs`) that actually builds the app. Keeping the real
# wiring in the lib crate lets the future `mmcp-gui-tauri` unit
# tests import it without going through the binary.
[lib]
name = "mmcp_gui_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "mmcp-gui-tauri"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Workspace store layer — path deps because src-tauri/ is excluded
# from the Rust workspace (see root Cargo.toml `[workspace.exclude]`).
mmcp-core = { path = "../../crates/mmcp-core" }
mmcp-git = { path = "../../crates/mmcp-git" }
mmcp-store = { path = "../../crates/mmcp-store" }
mmcp-sync = { path = "../../crates/mmcp-sync" }

tauri = { version = "2", features = [] }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v7", "serde"] }
semver = { version = "1", features = ["serde"] }
anyhow = "1"
