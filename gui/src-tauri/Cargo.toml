# An empty `[workspace]` table makes this crate its own workspace
# root, so Cargo's upward directory walk for workspace discovery
# stops here instead of continuing past this manifest. Without it,
# Cargo keeps walking past the root workspace's `exclude` entry for
# this path and, when this worktree is nested inside the main
# checkout's own directory tree (`.claude/worktrees/<id>/...`), lands
# on the MAIN checkout's root Cargo.toml instead — which does not
# recognize this deeply-nested path as its own excluded member and
# errors with "current package believes it's in a workspace when it's
# not". This table is the fix Cargo's own error message recommends.
[workspace]

# Same deny-warnings gate as the root workspace's `[workspace.lints]`
# (root Cargo.toml). This crate is its own separate workspace (see
# the comment above), so it does not inherit the root's lint table
# and needs its own copy to stay covered by the same gate.
[workspace.lints.rust]
warnings = "deny"

[workspace.lints.clippy]
all = "deny"

[package]
name = "mmcp-gui-tauri"
version = "0.1.6"
description = "mmcp-gui: Tauri 2 backend wrapping mmcp-store for the SvelteKit desktop client."
authors = ["Gabriel GRONDIN"]
edition = "2024"
rust-version = "1.88"

[lints]
workspace = true

# Tauri 2 convention: a tiny `main.rs` delegates to a library entry
# point (`lib.rs`) that actually builds the app. Keeping the real
# wiring in the lib crate lets the future `mmcp-gui-tauri` unit
# tests import it without going through the binary.
[lib]
name = "mmcp_gui_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "mmcp-gui-tauri"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Workspace store layer — path deps because src-tauri/ is excluded
# from the Rust workspace (see root Cargo.toml `[workspace.exclude]`).
mmcp-core = { path = "../../crates/mmcp-core" }
mmcp-git = { path = "../../crates/mmcp-git" }
mmcp-store = { path = "../../crates/mmcp-store" }
mmcp-sync = { path = "../../crates/mmcp-sync" }

tauri = { version = "2", features = ["devtools"] }
tauri-plugin-dialog = "2"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v7", "serde"] }
semver = { version = "1", features = ["serde"] }
anyhow = "1"
similar = { version = "2", features = ["inline"] }
notify-debouncer-mini = "0.4"

# Redirect every gitoxide crate to the GGLinnk/gitoxide fork.
# mmcp-git declares `gix` features (`serve-upload-pack`,
# `serve-receive-pack`) that only exist in the fork — crates.io
# `gix` 0.81 doesn't know them. Pinned to an exact commit (matching
# the root workspace Cargo.toml) rather than the branch tip, since the
# branch has been rewritten more than once and its tip does not
# currently build. See the root Cargo.toml's patch block comment for
# the investigated evidence behind this specific revision.
# The root workspace Cargo.toml applies the same patch for workspace
# members, but this crate is excluded from the workspace (it's the
# Tauri backend), so the patch has to be repeated here. Remove both
# copies once the fork's push + serve work lands on crates.io (handoff
# plan in the fork's GITOXIDE_UPSTREAM_HANDOFF.md).
[patch.crates-io]
gix = { git = "https://github.com/GGLinnk/gitoxide.git", rev = "d70d0a1b7c0eb9872a0eb49a755d4b8a7af25b61" }
