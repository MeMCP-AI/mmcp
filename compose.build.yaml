# Builds the server image from this repository instead of pulling it.
# Use it with: docker compose -f compose.yaml -f compose.build.yaml up -d --build
# The local image is tagged mmcp-server:local, so it never replaces the published tag.

services:
  mmcp-server:
    image: mmcp-server:local
    pull_policy: build
    build:
      context: .
      dockerfile: docker/server.Dockerfile
