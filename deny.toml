# cargo-deny configuration for the mmcp workspace.
# Docs: https://embarkstudios.github.io/cargo-deny/

# Advisories stay on cargo-deny's strict default: any unresolved
# RUSTSEC advisory is a hard error. This is the load-bearing check.
[advisories]
ignore = []

[licenses]
# Every SPDX license actually present in the resolved dependency
# graph, confirmed via `cargo deny check licenses` against the
# built-in strict default before this file existed.
# BSL-1.0 (xxhash-rust) joined the list afterwards.
# It is permissive, approved by the OSI and the FSF, and asks for no notice in a binary distribution.
# AGPL-3.0-only is deliberately NOT allow-listed here.
# The one crate that carries it, evalexpr, has its own exception below.
allow = [
    "0BSD",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MIT-0",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]

# evalexpr (AGPL-3.0-only) is pulled in transitively via the acdc-parser fork.
# The operator decided to keep it, on 2026-10-04: a project's license affects neither ours nor the projects we use.
# The exception names this one crate, so no other AGPL-3.0-only crate passes unnoticed.
[[licenses.exceptions]]
name = "evalexpr"
allow = ["AGPL-3.0-only"]

[sources]
# The two deliberately-pinned git forks this workspace tracks (see
# the root Cargo.toml `git =` dependency and `[patch.crates-io]`
# entries for the reasoning behind each pin).
allow-git = [
    "https://github.com/nlopes/acdc.git",
    "https://github.com/GGLinnk/gitoxide.git",
]
