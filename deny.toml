# cargo-deny configuration for the mmcp workspace.
# Docs: https://embarkstudios.github.io/cargo-deny/

[advisories]
# Advisories stay on cargo-deny's strict default.
# Any unresolved RUSTSEC advisory is a hard error.
ignore = []

[licenses]
# Every SPDX license present in the resolved dependency graph is listed.
# BSL-1.0 (xxhash-rust) is permissive, approved by the OSI and the FSF, and asks for no notice in a binary distribution.
# AGPL-3.0-only is deliberately not allow-listed here.
# The one crate that carries it, evalexpr, has its own exception below.
allow = [
    "0BSD",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MIT-0",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]

# evalexpr (AGPL-3.0-only) is pulled in transitively via the acdc-parser fork.
# The operator decided to keep it: the license of a dependency affects neither our license nor the projects we use.
# The exception names this one crate, so no other AGPL-3.0-only crate passes unnoticed.
[[licenses.exceptions]]
name = "evalexpr"
allow = ["AGPL-3.0-only"]

[sources]
# The two deliberately pinned git forks this workspace tracks.
# The root Cargo.toml `git =` dependency and `[patch.crates-io]` entries hold the reasoning behind each pin.
allow-git = [
    "https://github.com/nlopes/acdc.git",
    "https://github.com/GGLinnk/gitoxide.git",
]
