# Local development stack for mmcp. Replace each `build:` block with an
# `image: ghcr.io/<owner>/mmcp-<name>:main` to run the published images
# from GHCR instead of building from source.

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mmcp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mmcp}
      POSTGRES_DB: ${POSTGRES_DB:-mmcp}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mmcp}"]
      interval: 5s
      timeout: 5s
      retries: 5

  server:
    build:
      context: .
      dockerfile: docker/server.Dockerfile
    restart: unless-stopped
    # NOTE: tower-sessions is currently backed by MemoryStore (see
    # crates/mmcp-server/src/app.rs), so sessions do not survive a
    # container restart. Swap to a persistent store before production.
    environment:
      MMCP_BIND: 0.0.0.0:8787
      MMCP_DATABASE_URL: postgres://${POSTGRES_USER:-mmcp}:${POSTGRES_PASSWORD:-mmcp}@postgres:5432/${POSTGRES_DB:-mmcp}
      MMCP_REPO_ROOT: /data/repos
      # Must be set in `.env` (64 hex chars). See .env.example for
      # how to generate one; the server seeds a random key if this
      # is missing, but that key does not survive restarts so every
      # reboot would invalidate all live sessions.
      MMCP_TOKEN_KEY_HEX: ${MMCP_TOKEN_KEY_HEX:?set MMCP_TOKEN_KEY_HEX in .env (openssl rand -hex 32)}
      MMCP_ORIGIN: ${MMCP_ORIGIN:-http://localhost:8787}
      MMCP_OAUTH_GITHUB_CLIENT_ID: ${MMCP_OAUTH_GITHUB_CLIENT_ID:-}
      MMCP_OAUTH_GITHUB_CLIENT_SECRET: ${MMCP_OAUTH_GITHUB_CLIENT_SECRET:-}
    volumes:
      - mmcp-repos:/data/repos
    ports:
      - "8787:8787"
    # The server binary's `healthcheck` subcommand reads MMCP_BIND
    # from the container env, then does an HTTP GET against loopback
    # at the resolved port. Avoids shipping curl/wget in the runtime
    # image — distroless has neither — and gates the webui on a
    # genuine readiness signal rather than mere container start.
    healthcheck:
      test: ["CMD", "/usr/local/bin/mmcp-server", "healthcheck"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s
    depends_on:
      postgres:
        condition: service_healthy

  webui:
    build:
      context: .
      dockerfile: docker/webui.Dockerfile
      args:
        # Baked into the static bundle at build time; leave blank to
        # let the browser talk to the server on its configured origin
        # (http://127.0.0.1:8787 by default).
        VITE_MMCP_SERVER_URL: ${MMCP_ORIGIN:-}
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      server:
        condition: service_healthy

volumes:
  postgres-data:
  mmcp-repos:
