# Keep every independently resolved package tree up to date.
version: 2
updates:
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      compatible-rust:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: "cargo"
    directory: "/gui/src-tauri"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      compatible-tauri:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: "bun"
    directory: "/gui"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      compatible-gui:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: "bun"
    directory: "/webui"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      compatible-webui:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: "docker"
    directory: "/docker"
    schedule:
      interval: "weekly"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
