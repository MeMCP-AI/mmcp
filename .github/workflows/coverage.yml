name: coverage

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  llvm-cov:
    name: cargo-llvm-cov
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          # Coverage target dir is separate from the regular build
          # so key the cache on it — otherwise successful
          # non-coverage builds would poison the coverage rebuild.
          cache-directories: |
            ~/.cargo/registry
            ~/.cargo/git
            target/llvm-cov-target

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov

      - name: Generate LCOV report
        # `--lib --tests` matches the mutation and regular test
        # scopes, so coverage numbers line up with what the other
        # jobs verify. `--workspace` walks every member crate; the
        # `webui` and `*/fuzz` sub-projects are already excluded by
        # the workspace manifest.
        run: |
          cargo llvm-cov --workspace --lib --tests \
            --lcov --output-path lcov.info

      - name: Print summary
        run: cargo llvm-cov report --workspace --lib --tests --summary-only

      - name: Upload LCOV artifact
        uses: actions/upload-artifact@v4
        with:
          name: lcov-${{ github.sha }}
          path: lcov.info
          retention-days: 30
          if-no-files-found: error
