[package]
name = "mmcp-gui"
description = "mmcp-gui: desktop visual client for local memory stores. Reads, writes, and syncs memories straight from ~/.mmcp/ through mmcp-store's typed façade — no MCP protocol round-trip."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true

[dependencies]
mmcp-core = { workspace = true }
mmcp-git = { workspace = true }
mmcp-store = { workspace = true }
mmcp-sync = { workspace = true }

eframe = { version = "0.34", features = ["persistence"] }
egui_commonmark = { version = "0.23", features = ["better_syntax_highlighting"] }
# Phosphor icon font: provides real iconography across buttons,
# disclosures, severity markers, and status indicators so we don't
# depend on miscellaneous Unicode glyphs that render inconsistently
# across platforms. `default-features = false` + `regular` keeps the
# font payload to the single weight we use.
egui-phosphor = { version = "0.12", default-features = false, features = ["regular"] }

anyhow = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
uuid = { workspace = true }

[lints]
workspace = true
