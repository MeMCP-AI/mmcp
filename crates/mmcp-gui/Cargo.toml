[package]
name = "mmcp-gui"
description = "mmcp-gui: desktop visual client for local memory stores. Reads, writes, and syncs memories straight from ~/.mmcp/ through mmcp-store's typed façade — no MCP protocol round-trip."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true

[dependencies]
mmcp-core = { workspace = true }
mmcp-git = { workspace = true }
mmcp-store = { workspace = true }
mmcp-sync = { workspace = true }

eframe = "0.34"
egui_commonmark = { version = "0.23", features = ["better_syntax_highlighting"] }

anyhow = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[lints]
workspace = true
