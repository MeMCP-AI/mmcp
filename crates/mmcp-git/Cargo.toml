[package]
name = "mmcp-git"
description = "Git storage abstraction for mmcp: GitBackend trait and backend implementations"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true

[dependencies]
mmcp-core = { workspace = true }
thiserror = { workspace = true }
async-trait = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
uuid = { workspace = true }
gix = { workspace = true }
bytes = { workspace = true }
moka = { workspace = true }
tracing = { workspace = true }

# Optional, pulled in only when the `testing` feature is enabled.
# Downstream consumers can activate the fixture without paying the tempfile compile cost at release time.
tempfile = { version = "3", optional = true }

[dev-dependencies]
tempfile = "3"
serde_json = "1"

[features]
# Opt-in fixtures reused by consumer test suites, the same pattern as mmcp-store's `testing` feature.
testing = ["dep:tempfile"]

[lints]
workspace = true
