[package]
name = "mmcp-core"
description = "Pure data model and logic for mmcp: types, semver, ACL resolver, load-set resolver"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true

[dependencies]
thiserror = { workspace = true }
serde = { workspace = true }
uuid = { workspace = true }
jiff = { workspace = true }
semver = { workspace = true }
toml = { workspace = true }
serde_json = "1"
serde_yaml = "0.9"
gray_matter = { version = "0.3", features = ["toml", "yaml", "json"] }
# CommonMark parser used by the memory-body section editor.
# Already transitively compiled via gray_matter's dep graph, so
# listing it directly here costs nothing.
pulldown-cmark = { version = "0.13", default-features = false }
slug = { workspace = true }
strum = { workspace = true }
strum_macros = { workspace = true }

[dev-dependencies]
proptest = { version = "1", default-features = false, features = ["std"] }

[lints]
workspace = true
