[package]
name = "mmcp-core-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

# Excluded from the root workspace (see its `exclude` entry and
# accompanying comment) because libfuzzer-sys only compiles under
# libFuzzer on Linux/macOS. An empty table here is required so cargo
# stops walking upward for an enclosing workspace when invoked
# directly against this manifest, which is exactly how `cargo fuzz
# run` (and CI's `working-directory: crates/mmcp-core/fuzz`) invokes
# it; without it cargo sees this package listed in the root's
# `exclude` rather than `members` and refuses to build.
[workspace]

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
mmcp-core = { path = ".." }

# cargo-fuzz expects each target to be its own binary. Declare them
# here so `cargo fuzz run <target>` and the CI workflow pick them up.
[[bin]]
name = "memory_file_parse"
path = "fuzz_targets/memory_file_parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "memory_frontmatter_parse"
path = "fuzz_targets/memory_frontmatter_parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "project_config_from_toml"
path = "fuzz_targets/project_config_from_toml.rs"
test = false
doc = false
bench = false

[[bin]]
name = "group_manifest_from_toml"
path = "fuzz_targets/group_manifest_from_toml.rs"
test = false
doc = false
bench = false
