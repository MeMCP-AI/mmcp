[package]
name = "mmcp-client"
description = "mmcp client: MCP stdio server, sync engine, hook handler, and user CLI"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true

[[bin]]
name = "mmcp"
path = "src/main.rs"

[dependencies]
mmcp-core = { workspace = true }
mmcp-git = { workspace = true }
mmcp-proto = { workspace = true }
mmcp-sync = { workspace = true }
mmcp-store = { workspace = true }

# Names the element type `NativeBackend::read_files` returns (serve.rs's
# `BatchReadOutcome`, list_memories' batched-descriptor seam); mmcp-git
# also depends on bytes so the transitive dep already compiles, listing
# it directly keeps the crate-level dep set explicit.
bytes = { workspace = true }

anyhow = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
clap = { workspace = true }
inquire = { workspace = true }
slug = { workspace = true }
serde = { workspace = true }
serde_json = "1"
uuid = { workspace = true }
rmcp = { workspace = true }
notify = "8"
sqlx = { workspace = true }
comfy-table = { workspace = true }
strum = { workspace = true }

[dev-dependencies]
mmcp-store = { workspace = true, features = ["testing"] }
tempfile = "3"
assert_cmd = "2"
predicates = "3"

[build-dependencies]
anyhow = { workspace = true }
tempfile = "3"
cargo_toml = "0.22"
# `version` MCP tool: vergen-gitcl embeds build metadata (rustc
# version) and git SHA/describe as compile-time env vars, read via
# `env!` in serve.rs. It never links or shells out to git at
# runtime -- only `build.rs` invokes the `git` CLI, once, at
# compile time. vergen-git2 was rejected: it pulls in libgit2 (a
# *-sys C-binding crate), against the pure-Rust preference.
# vergen-gix was also rejected: it resolves a second, unpatched
# copy of gitoxide (0.86 from crates.io) alongside the workspace's
# patched `gix` fork pin (0.81, see root Cargo.toml), doubling an
# already-large dependency tree instead of reusing it.
vergen-gitcl = { version = "9", features = ["rustc"] }

[lints]
workspace = true
