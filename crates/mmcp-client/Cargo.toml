[package]
name = "mmcp-client"
description = "mmcp client: MCP stdio server, sync engine, hook handler, and user CLI"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true

[[bin]]
name = "mmcp"
path = "src/main.rs"

[dependencies]
mmcp-core = { workspace = true }
mmcp-git = { workspace = true }
mmcp-proto = { workspace = true }
mmcp-sync = { workspace = true }
mmcp-store = { workspace = true }

anyhow = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
clap = { workspace = true }
inquire = { workspace = true }
slug = { workspace = true }
serde = { workspace = true }
serde_json = "1"
uuid = { workspace = true }
rmcp = { workspace = true }
notify = "8"
sqlx = { workspace = true }

[dev-dependencies]
mmcp-store = { workspace = true, features = ["testing"] }
tempfile = "3"
assert_cmd = "2"
predicates = "3"

[build-dependencies]
tempfile = "3"
cargo_toml = "0.22"

[lints]
workspace = true
