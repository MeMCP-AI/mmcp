[package]
name = "mmcp-server"
description = "mmcp server daemon: HTTP/SSE MCP, WebUI API, git smart HTTP, auth, database"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true

[[bin]]
name = "mmcp-server"
path = "src/main.rs"

[dependencies]
mmcp-core = { workspace = true }
mmcp-git = { workspace = true }
mmcp-db = { workspace = true }
mmcp-auth = { workspace = true }
mmcp-proto = { workspace = true }
mmcp-sync = { workspace = true }
# Only for `MmcpHome::discover`/`load_user_config`, so the
# password-length config-file tier reads `~/.mmcp/config.toml`
# through the same mechanism every other mmcp consumer uses instead
# of re-deriving the home-directory layout locally.
mmcp-store = { workspace = true }

anyhow = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
futures-util = { workspace = true }
getrandom = { workspace = true }
hex = { workspace = true }
clap = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
axum = { workspace = true }
tower-http = { workspace = true }
serde = { workspace = true }
serde_json = "1"
uuid = { workspace = true }
jiff = { workspace = true }
sea-orm = { workspace = true }
axum-login = { workspace = true }
tower-sessions = { workspace = true }
webauthn-rs = { workspace = true }
time = { workspace = true }
reqwest = { workspace = true }
urlencoding = "2"

# Direct gix dep so the smart-HTTP routes can drive
# `Repository::serve_*` in-process, without a `git` binary on the server.
gix = { workspace = true }

[dev-dependencies]
tokio = { workspace = true }
reqwest = { workspace = true, features = ["cookies"] }
tempfile = "3"
serde_json = "1"
axum = { workspace = true }
mmcp-core = { workspace = true }
mmcp-git = { workspace = true }
mmcp-db = { workspace = true }
mmcp-auth = { workspace = true }
jiff = { workspace = true }
uuid = { workspace = true }

[lints]
workspace = true
