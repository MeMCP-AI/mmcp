[package]
name = "mmcp-db"
description = "SeaORM entities and migrations shared by mmcp server and client"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true

[dependencies]
thiserror = { workspace = true }
sea-orm = { workspace = true }
sea-orm-migration = { workspace = true }
serde = { workspace = true }
uuid = { workspace = true }
async-trait = { workspace = true }
# Force the `bundled` feature of libsqlite3-sys into the dep graph so
# the transitive sqlx-sqlite driver statically links libsqlite3, which
# lets the distroless runtime (no shared libsqlite3) open sqlite URLs.
libsqlite3-sys = { workspace = true }

[dev-dependencies]
tokio = { workspace = true }

[lints]
workspace = true

# cargo-machete flags libsqlite3-sys as unused because it is never
# referenced by name in Rust source; it is pulled in purely to force
# the `bundled` Cargo feature onto the transitive sqlx-sqlite driver
# (see the dependency comment above), which is a legitimate
# feature-only dependency, not dead code.
[package.metadata.cargo-machete]
ignored = ["libsqlite3-sys"]
