[package]
name = "mmcp-db"
description = "SeaORM entities and migrations shared by mmcp server and client"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true

[dependencies]
mmcp-core = { workspace = true }
thiserror = { workspace = true }
sea-orm = { workspace = true }
sea-orm-migration = { workspace = true }
serde = { workspace = true }
uuid = { workspace = true }
async-trait = { workspace = true }
# Force the `bundled` feature of libsqlite3-sys into the dep graph so
# the transitive sqlx-sqlite driver statically links libsqlite3, which
# lets the distroless runtime (no shared libsqlite3) open sqlite URLs.
libsqlite3-sys = { workspace = true }

[dev-dependencies]
tokio = { workspace = true }

[lints]
workspace = true
